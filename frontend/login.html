<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DermAI Skin Health Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-notes-medical"></i></div>
        <span>Derm<span style="color: var(--primary);">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-sm btn-outline">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Section -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="logo-icon" style="margin: 0 auto 1rem; width: 56px; height: 56px; font-size: 1.8rem;">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2>Welcome Back</h2>
        <p style="color: var(--slate-500); font-size: 0.9rem;">Sign in to access your skin screening portal</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Portal Access Type</label>
          <select id="user-role" class="form-control">
            <option value="user">Patient / User Account</option>
            <option value="admin">Administrator Panel</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" id="email-label">Email / Username</label>
          <input type="text" id="email" class="form-control" placeholder="user@example.com or admin" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
      </form>

      <div class="text-center mt-3" style="font-size: 0.9rem; color: var(--slate-600);">
        Don't have an account? <a href="register.html" style="font-weight:700;">Register Now</a>
      </div>

      <div class="mt-3 p-2 text-center" style="background: var(--primary-light); border-radius: 8px; font-size: 0.8rem; color: var(--primary-dark);">
        <strong>Demo Admin Credentials:</strong><br>Username: <code>admin</code> | Password: <code>admin123</code>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
