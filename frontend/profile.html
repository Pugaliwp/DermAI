<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - DermAI Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="container-fluid">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-notes-medical"></i></div>
        <span>Derm<span style="color: var(--primary);">AI</span> Portal</span>
      </a>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-chart-pie"></i> Dashboard Overview</a></li>
        <li><a href="upload.html" class="sidebar-link"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Skin Scan</a></li>
        <li><a href="history.html" class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i> Screening History</a></li>
        <li><a href="disease-info.html" class="sidebar-link"><i class="fa-solid fa-book-medical"></i> Disease Library</a></li>
        <li><a href="profile.html" class="sidebar-link active"><i class="fa-solid fa-user-gear"></i> Account Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="dashboard-header">
        <div>
          <h1 style="font-size: 1.8rem;">User Account Profile</h1>
          <p style="color: var(--slate-500); font-size: 0.95rem;">Manage your personal profile information and security credentials.</p>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 280px 1fr; gap: 2rem;">
        
        <!-- Profile Sidebar Card -->
        <div class="result-card" style="text-align: center; padding: 2.5rem 1.5rem;">
          <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.25rem; box-shadow: var(--shadow-md);">
            <i class="fa-solid fa-user"></i>
          </div>
          <h3 id="display-name" style="font-size: 1.3rem;">User Name</h3>
          <p id="display-email" style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 1.5rem;">user@example.com</p>
          <span class="badge badge-primary"><i class="fa-solid fa-shield"></i> Verified Account</span>
        </div>

        <!-- Edit Form Card -->
        <div class="result-card">
          <h3 style="margin-bottom: 1.5rem; color: var(--dark-navy);"><i class="fa-solid fa-pen-to-square" style="color: var(--primary);"></i> Edit Profile Information</h3>

          <form id="profile-form">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="profile-full-name" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address (Read Only)</label>
              <input type="email" id="profile-email" class="form-control" readonly style="background-color: var(--slate-100);">
            </div>

            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="tel" id="profile-phone" class="form-control">
            </div>

            <div class="form-group">
              <label class="form-label">Update Password (Leave blank to keep unchanged)</label>
              <input type="password" id="profile-password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-lg"><i class="fa-solid fa-floppy-disk"></i> Save Profile Changes</button>
          </form>
        </div>

      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
